<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#0369a1" />
      <stop offset="85%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Radial Glow Behind Card -->
    <radialGradient id="ambientGlow" cx="72%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Secondary Card Gradient -->
    <linearGradient id="backCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Laser Beam Gradient -->
    <linearGradient id="laserBeamGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Gold Badge Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Blue Header on Card -->
    <linearGradient id="cardHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Shadow Filters -->
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#020617" flood-opacity="0.55" />
    </filter>

    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020617" flood-opacity="0.4" />
    </filter>

    <filter id="laserGlow" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Solid Background -->
  <rect width="1024" height="500" fill="url(#bgGrad)" />

  <!-- Ambient Glow in the Right/Visual Zone -->
  <rect width="1024" height="500" fill="url(#ambientGlow)" />

  <!-- Decorative Circuit / Radar Rings -->
  <circle cx="730" cy="250" r="230" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.08" />
  <circle cx="730" cy="250" r="310" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="8 8" opacity="0.06" />
  <circle cx="730" cy="250" r="390" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.04" />

  <!-- Diagonal Accent Lines in Background -->
  <line x1="0" y1="420" x2="480" y2="500" stroke="#38bdf8" stroke-width="1.5" opacity="0.12" />
  <line x1="0" y1="460" x2="360" y2="500" stroke="#38bdf8" stroke-width="1" opacity="0.08" />

  <!-- ================= LEFT COLUMN: APP TITLE & FEATURES ================= -->
  <g transform="translate(70, 70)">
    <!-- Small App Logo / Icon Emblem -->
    <g transform="translate(0, 0)">
      <rect width="52" height="52" rx="14" fill="#0ea5e9" filter="url(#badgeShadow)" />
      <!-- Mini ID Card in Icon -->
      <rect x="9" y="14" width="34" height="24" rx="4" fill="#ffffff" />
      <rect x="13" y="18" width="9" height="10" rx="2" fill="#38bdf8" />
      <rect x="25" y="19" width="14" height="3" rx="1.5" fill="#94a3b8" />
      <rect x="25" y="24" width="10" height="2.5" rx="1" fill="#cbd5e1" />
      <!-- Mini Scan Laser -->
      <line x1="6" y1="26" x2="46" y2="26" stroke="#00e5ff" stroke-width="2" />
    </g>

    <!-- Category Pill -->
    <g transform="translate(66, 12)">
      <rect width="170" height="28" rx="14" fill="#ffffff" fill-opacity="0.12" />
      <text x="85" y="19" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5" text-anchor="middle">OFFLINE SCANNER</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="112" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      ID Card Scan
    </text>
    <text x="0" y="162" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#38bdf8" letter-spacing="-0.5">
      &amp; Copy
    </text>

    <!-- Subtitle -->
    <text x="0" y="202" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#94a3b8">
      Dual-sided ID scanning &amp; high quality multi-copy print
    </text>

    <!-- Feature Bullet Cards / Pills -->
    <g transform="translate(0, 230)">
      <!-- Pill 1: 8x Copies -->
      <g transform="translate(0, 0)">
        <rect width="380" height="38" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" />
        <circle cx="20" cy="19" r="10" fill="#f59e0b" fill-opacity="0.2" />
        <text x="20" y="23" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="900" fill="#fbbf24" text-anchor="middle">8X</text>
        <text x="40" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#f1f5f9">Print 8 Copies on Single A4 Sheet</text>
      </g>

      <!-- Pill 2: Dual Sided -->
      <g transform="translate(0, 48)">
        <rect width="380" height="38" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" />
        <circle cx="20" cy="19" r="10" fill="#0284c7" fill-opacity="0.3" />
        <!-- Dual Card Icon -->
        <rect x="14" y="13" width="7" height="9" rx="1.5" fill="#38bdf8" />
        <rect x="19" y="16" width="7" height="9" rx="1.5" fill="#ffffff" />
        <text x="40" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#f1f5f9">Front &amp; Back Smart Dual-Crop</text>
      </g>

      <!-- Pill 3: Privacy First -->
      <g transform="translate(0, 96)">
        <rect width="380" height="38" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" />
        <circle cx="20" cy="19" r="10" fill="#10b981" fill-opacity="0.2" />
        <!-- Lock icon -->
        <path d="M 18 17 L 18 15 C 18 13.9 18.9 13 20 13 C 21.1 13 22 13.9 22 15 L 22 17 Z M 16.5 17 L 23.5 17 C 24 17 24.5 17.5 24.5 18 L 24.5 23 C 24.5 23.5 24 24 23.5 24 L 16.5 24 C 16 24 15.5 23.5 15.5 23 L 15.5 18 C 15.5 17.5 16 17 16.5 17 Z" fill="#34d399" />
        <text x="40" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#f1f5f9">100% Offline • Total Privacy Guaranteed</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: HERO VISUAL GRAPHIC ================= -->
  <g transform="translate(520, 20)">

    <!-- BACK CARD (Tilted Backing Card showing Back of ID) -->
    <g transform="translate(130, 90) rotate(10)" filter="url(#cardShadow)">
      <rect width="310" height="195" rx="18" fill="url(#backCardBg)" />
      <!-- Magnetic Strip on Back of Card -->
      <rect x="0" y="28" width="310" height="36" fill="#1e293b" />
      <!-- Signature Stripe & Security Info -->
      <rect x="22" y="78" width="180" height="24" rx="4" fill="#ffffff" />
      <rect x="210" y="78" width="60" height="24" rx="4" fill="#f8fafc" />
      <text x="240" y="94" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">CCV 892</text>
      <!-- Barcode Graphic -->
      <g transform="translate(22, 120)">
        <rect x="0" y="0" width="3" height="30" fill="#334155" />
        <rect x="6" y="0" width="2" height="30" fill="#334155" />
        <rect x="11" y="0" width="5" height="30" fill="#334155" />
        <rect x="19" y="0" width="2" height="30" fill="#334155" />
        <rect x="24" y="0" width="4" height="30" fill="#334155" />
        <rect x="31" y="0" width="1" height="30" fill="#334155" />
        <rect x="35" y="0" width="6" height="30" fill="#334155" />
        <rect x="44" y="0" width="3" height="30" fill="#334155" />
        <rect x="50" y="0" width="2" height="30" fill="#334155" />
        <rect x="55" y="0" width="5" height="30" fill="#334155" />
        <rect x="63" y="0" width="2" height="30" fill="#334155" />
        <rect x="68" y="0" width="4" height="30" fill="#334155" />
        <rect x="75" y="0" width="3" height="30" fill="#334155" />
        <rect x="81" y="0" width="6" height="30" fill="#334155" />
        <rect x="90" y="0" width="2" height="30" fill="#334155" />
        <rect x="95" y="0" width="4" height="30" fill="#334155" />
        <rect x="102" y="0" width="2" height="30" fill="#334155" />
        <rect x="107" y="0" width="5" height="30" fill="#334155" />
      </g>
      <!-- "BACK SIDE" Label Badge -->
      <rect x="200" y="130" width="85" height="22" rx="11" fill="#475569" />
      <text x="242" y="145" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">BACK SIDE</text>
    </g>

    <!-- FRONT CARD (Main Hero Card) -->
    <g transform="translate(60, 150) rotate(-5)" filter="url(#cardShadow)">
      <rect width="340" height="215" rx="20" fill="url(#cardBg)" stroke="#ffffff" stroke-width="1.5" />
      
      <!-- Top Color Banner -->
      <path d="M 0 20 Q 0 0 20 0 L 320 0 Q 340 0 340 20 L 340 42 L 0 42 Z" fill="url(#cardHeaderGrad)" />
      <text x="20" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="1">NATIONAL IDENTITY CARD</text>
      <!-- Official Emblem / Chip Star -->
      <circle cx="316" cy="21" r="9" fill="#ffffff" fill-opacity="0.25" />
      <circle cx="316" cy="21" r="5" fill="#ffffff" />

      <!-- Smart EMV Chip -->
      <g transform="translate(26, 60)">
        <rect width="36" height="28" rx="6" fill="#f59e0b" />
        <rect x="3" y="3" width="30" height="22" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1" />
        <line x1="3" y1="14" x2="33" y2="14" stroke="#d97706" stroke-width="1" />
        <line x1="14" y1="3" x2="14" y2="25" stroke="#d97706" stroke-width="1" />
        <line x1="22" y1="3" x2="22" y2="25" stroke="#d97706" stroke-width="1" />
      </g>

      <!-- ID Photo Frame -->
      <g transform="translate(24, 102)">
        <rect width="78" height="96" rx="10" fill="#0284c7" fill-opacity="0.12" stroke="#cbd5e1" stroke-width="1.5" />
        <!-- Stylized Avatar -->
        <rect width="78" height="96" rx="10" fill="#94a3b8" />
        <circle cx="39" cy="38" r="18" fill="#e2e8f0" />
        <path d="M 12 86 C 12 58, 66 58, 66 86 Z" fill="#e2e8f0" />
      </g>

      <!-- Personal Info Fields -->
      <g transform="translate(120, 64)">
        <text x="0" y="10" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#64748b" letter-spacing="0.5">NAME / NOM</text>
        <rect x="0" y="14" width="165" height="15" rx="6" fill="#1e293b" />
        <text x="8" y="26" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">JANE DOE</text>

        <text x="0" y="47" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#64748b" letter-spacing="0.5">ID NUMBER</text>
        <rect x="0" y="51" width="130" height="13" rx="5" fill="#475569" />
        <text x="8" y="62" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="600" fill="#f8fafc">ID-9824-0012</text>

        <text x="0" y="81" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#64748b" letter-spacing="0.5">VALID THRU</text>
        <rect x="0" y="85" width="90" height="12" rx="4" fill="#94a3b8" />
        <text x="8" y="95" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#ffffff">12 / 2030</text>
      </g>

      <!-- Hologram Seal -->
      <circle cx="285" cy="165" r="24" fill="#06b6d4" fill-opacity="0.15" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="4 2" />
      <text x="285" y="169" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#0284c7" text-anchor="middle">SECURE</text>

      <!-- Corner crop marks / scanner brackets on card -->
      <path d="M 8 18 L 8 8 L 18 8" fill="none" stroke="#00e5ff" stroke-width="2.5" />
      <path d="M 332 18 L 332 8 L 322 8" fill="none" stroke="#00e5ff" stroke-width="2.5" />
      <path d="M 8 197 L 8 207 L 18 207" fill="none" stroke="#00e5ff" stroke-width="2.5" />
      <path d="M 332 197 L 332 207 L 322 207" fill="none" stroke="#00e5ff" stroke-width="2.5" />
    </g>

    <!-- LASER SCANNER OVERLAY -->
    <g transform="translate(20, 230) rotate(-5)">
      <!-- Projection Light Beam Trapezoid -->
      <polygon points="10,0 420,0 390,95 40,95" fill="url(#laserBeamGrad)" />
      <!-- High Intensity Laser Beam Line -->
      <rect x="0" y="-3" width="430" height="7" rx="3.5" fill="#00e5ff" filter="url(#laserGlow)" />
      <rect x="20" y="-1.5" width="390" height="4" rx="2" fill="#ffffff" />
    </g>

    <!-- FLOATING 8X MULTI-COPY BADGE -->
    <g transform="translate(325, 295)" filter="url(#badgeShadow)">
      <circle cx="56" cy="56" r="54" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3.5" />
      <!-- Inner dashed circle -->
      <circle cx="56" cy="56" r="46" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 4" opacity="0.75" />
      <!-- Main Badge Content -->
      <text x="56" y="58" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">8X</text>
      <text x="56" y="78" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="900" fill="#ffffff" letter-spacing="1.5" text-anchor="middle">COPIES</text>
    </g>
  </g>
</svg>
